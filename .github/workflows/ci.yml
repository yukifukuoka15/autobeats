name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # unit / integration テストは OS 非依存なので Ubuntu で実行する（Electron 本体の取得も不要）
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fixtures
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run
