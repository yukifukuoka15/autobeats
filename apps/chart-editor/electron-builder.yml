appId: jp.kosenfes2026.autobeats.chart-editor
productName: AutoBeats Chart Editor
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
extraResources:
  - from: resources/youtube
    to: youtube
    filter:
      - "**/*"
      - "!**/__pycache__/**"
  - from: resources/youtube-runtime-build/import_audio
    to: youtube-runtime
extraMetadata:
  main: out/main/index.js
npmRebuild: false
nodeGypRebuild: false
# 署名なし（配布時に Apple Developer ID / Windows コード署名を追加する）
mac:
  category: public.app-category.music
  icon: resources/icon.icns
  target:
    - target: dmg
    - target: zip
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false
  extendInfo:
    NSMicrophoneUsageDescription: このアプリはマイクを使用しません。
win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: AutoBeats Chart Editor
portable:
  artifactName: ${productName}-${version}-win-${arch}-portable.${ext}
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
publish: null
